replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 90
  periodSeconds: 10

readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 60
  periodSeconds: 10

image:
  repository: khatanve/webapp-demo
  tag: latest
  pullPolicy: Always

ingress:
  enabled: true
  path: /
  className: traefik
  annotations: {}
  host: ""
