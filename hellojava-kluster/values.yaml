replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 90
  periodSeconds: 10

readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 60
  periodSeconds: 10

image:
  repository: khatanve/webapp-demo
  tag: latest
  pullPolicy: Always

ingress:
  enabled: true
  path: /
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  host: ""

#Use below className based on cluster
#className: alb for aws eks cluster
#className: traefik for local k3s cluster

